[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coalition-formation"
version = "0.1.0"
description = "A reproducible toolkit for multi-robot coalition-formation research."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Marshall Vielmetti" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26,<2.3",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
viz = []
graph = []
opt = []
rl = []
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/MarshallVielmetti/coalition_formation"
Repository = "https://github.com/MarshallVielmetti/coalition_formation"
Issues = "https://github.com/MarshallVielmetti/coalition_formation/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--cov=coalition_formation",
    "--cov-report=term-missing",
]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["coalition_formation"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 88
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"

[tool.mypy]
files = ["src"]
python_version = "3.11"
strict = true
warn_unused_configs = true
